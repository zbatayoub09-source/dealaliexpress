<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ayoub Deals | AliExpress</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}.top{background:#111;color:#fff;padding:10px;text-align:center;font-size:13px}.hero{background:linear-gradient(135deg,#171717,#343434);color:#fff;padding:25px 18px;text-align:center}.logo{font-size:34px;font-weight:900}.sub{margin:7px 0 18px;color:#ddd}.social{display:flex;justify-content:center;gap:10px}.social a{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}.fb{background:#1877f2}.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.tt{background:#000;border:1px solid #777}.wa{background:#25d366}.toolbar{max-width:1250px;margin:20px auto 8px;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px}.select{padding:14px;border:1px solid #ddd;border-radius:12px;background:#fff}.cats{max-width:1250px;margin:10px auto;padding:0 18px;display:flex;gap:8px;overflow:auto}.cat{border:0;background:#fff;padding:9px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}.cat.active{background:#111;color:#fff}.info{max-width:1250px;margin:12px auto;padding:0 18px;display:flex;justify-content:space-between;color:#777;font-size:14px}.grid{max-width:1250px;margin:auto;padding:0 18px 45px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #0001;transition:.2s;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px #0002}.pic{height:230px;background:#eee;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:#e11d48;color:#fff;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:bold}.heart{position:absolute;top:10px;right:10px;width:35px;height:35px;border:0;border-radius:50%;background:#fff;cursor:pointer;font-size:17px}.content{padding:14px;display:flex;flex-direction:column;flex:1}.title{font-size:14px;line-height:1.4;height:60px;overflow:hidden}.price{font-size:21px;font-weight:900;color:#e11d48;margin-top:8px}.old{font-size:12px;color:#999;text-decoration:line-through;margin:3px 0 12px}.stats{font-size:12px;color:#777;margin-bottom:12px}.btn{margin-top:auto;background:#111;color:#fff;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold}.btn:hover{background:#e11d48}.empty{text-align:center;grid-column:1/-1;padding:60px;color:#777}.footer{text-align:center;padding:25px;color:#888;font-size:12px}@media(max-width:600px){.logo{font-size:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 10px 35px}.pic{height:175px}.content{padding:10px}.title{font-size:12px;height:52px}.price{font-size:17px}.btn{font-size:12px}.toolbar,.cats,.info{padding-left:10px;padding-right:10px}.select{width:100%}}
</style></head>
<body>
<div class="top">🔥 Daily AliExpress Deals • Affiliate Store</div>
<header class="hero"><div class="logo">🔥 Ayoub Deals</div><div class="sub">Discover products at special prices</div><div class="social"><a class="fb" href="https://www.facebook.com/ayoub.helalaboys.07" target="_blank"><i class="fab fa-facebook-f"></i></a><a class="ig" href="https://www.instagram.com/ayoubzt2015/" target="_blank"><i class="fab fa-instagram"></i></a><a class="tt" href="https://www.tiktok.com/@shopcut1" target="_blank"><i class="fab fa-tiktok"></i></a><a class="wa" href="https://wa.me/212622765085" target="_blank"><i class="fab fa-whatsapp"></i></a></div></header>
<div class="toolbar"><input id="search" class="search" placeholder="🔎 Search for a product..."><select id="sort" class="select"><option value="featured">Featured</option><option value="price">Price: Low to High</option><option value="discount">Biggest Discount</option><option value="sales">Most Sales</option></select></div>
<div class="cats"><button class="cat active" data-cat="all">All</button><button class="cat" data-cat="electronics">📱 Electronics</button><button class="cat" data-cat="tools">🔧 Tools</button><button class="cat" data-cat="home">🏠 Home</button><button class="cat" data-cat="car">🚗 Car</button><button class="cat" data-cat="fashion">👕 Fashion</button></div>
<div class="info"><span id="count">Loading...</span><span>Updated from products.csv</span></div><main id="products" class="grid"></main><footer class="footer">Affiliate links • Prices and availability may change on AliExpress</footer>
<script>
let all=[],cat='all',fav=JSON.parse(localStorage.getItem('ayoubFav')||'[]');
Papa.parse('./products.csv',{download:true,header:true,skipEmptyLines:true,complete:r=>{all=r.data.filter(p=>p['Image Url']&&p['Promotion Url']);render()},error:()=>document.getElementById('count').textContent='Could not load products.csv'});
function render(){let q=document.getElementById('search').value.toLowerCase().trim();let list=all.filter(p=>(p['Product Desc']||'').toLowerCase().includes(q));if(cat!=='all')list=list.filter(p=>(p['Product Desc']||'').toLowerCase().includes(cat));let s=document.getElementById('sort').value;if(s==='price')list.sort((a,b)=>num(a['Discount Price'])-num(b['Discount Price']));if(s==='discount')list.sort((a,b)=>num(b['Discount'])-num(a['Discount']));if(s==='sales')list.sort((a,b)=>num(b['Sales180Day'])-num(a['Sales180Day']));document.getElementById('count').textContent=list.length+' products';document.getElementById('products').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No products found 🔎</div>'}
function card(p){let id=p['ProductId'];let liked=fav.includes(id);return `<article class="card"><div class="pic"><img src="${safe(p['Image Url'])}" loading="lazy" onerror="this.src='https://via.placeholder.com/500?text=No+Image'"><span class="badge">-${safe(p['Discount']||'0%')}</span><button class="heart" onclick="toggleFav('${safe(id)}')">${liked?'❤️':'♡'}</button></div><div class="content"><div class="title">${safe(p['Product Desc'])}</div><div class="price">${safe(p['Discount Price'])}</div><div class="old">Was ${safe(p['Origin Price'])}</div><div class="stats">⭐ ${safe(p['Positive Feedback']||'')} • 🛒 ${safe(p['Sales180Day']||'0')} sold</div><a class="btn" href="${safe(p['Promotion Url'])}" target="_blank" rel="noopener noreferrer">View Deal →</a></div></article>`}
function toggleFav(id){if(fav.includes(id))fav=fav.filter(x=>x!==id);else fav.push(id);localStorage.setItem('ayoubFav',JSON.stringify(fav));render()}function num(v){return parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0}function safe(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}document.getElementById('search').addEventListener('input',render);document.getElementById('sort').addEventListener('change',render);document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});
</script></body></html>
