<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayoub Store</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#f1f5f9;
}

header{
background:#000;
padding:25px;
text-align:center;
}

.logo{
color:white;
font-size:35px;
font-weight:bold;
margin-bottom:20px;
}

.social-bar{
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}

.social-bar a{
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:24px;
text-decoration:none;
transition:0.3s;
}

.social-bar a:hover{
transform:translateY(-5px) scale(1.1);
}

.facebook{
background:#1877F2;
}

.instagram{
background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}

.tiktok{
background:#111;
border:2px solid white;
}

.whatsapp{
background:#25D366;
}

.container{
padding:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-content{
padding:18px;
}

.card h3{
font-size:18px;
margin-bottom:12px;
height:50px;
overflow:hidden;
}

.price{
font-size:24px;
font-weight:bold;
color:#e11d48;
margin-bottom:15px;
}

.btn{
display:block;
text-align:center;
padding:12px;
background:#111;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;
transition:0.3s;
}

.btn:hover{
background:#e11d48;
}

</style>

</head>

<body>

<header>

<div class="logo">
🔥 Ayoub Store
</div>

<div class="social-bar">

<a class="facebook"
href="https://www.facebook.com/ayoub.helalaboys.07"
target="_blank">

<i class="fab fa-facebook-f"></i>

</a>

<a class="instagram"
href="https://www.instagram.com/ayoubzt2015/"
target="_blank">

<i class="fab fa-instagram"></i>

</a>

<a class="tiktok"
href="https://www.tiktok.com/@shopcut1"
target="_blank">

<i class="fab fa-tiktok"></i>

</a>

<a class="whatsapp"
href="https://wa.me/212622765085"
target="_blank">

<i class="fab fa-whatsapp"></i>

</a>

</div>

</header>

<div id="products" class="container"></div>

<script>

console.log("START");

Papa.parse("./products.csv", {

download:true,
header:true,

complete:function(results){

let box=document.getElementById("products");

results.data.forEach(product => {

if(!product["Image Url"]) return;

box.innerHTML += `

<div class="card">

<img src="${product["Image Url"]}"
onerror="this.src='https://via.placeholder.com/300'">

<div class="card-content">

<h3>${product["Product Desc"]}</h3>

<div class="price">
${product["Discount Price"]}
</div>

<a class="btn"
href="${product["Promotion Url"]}"
target="_blank">

Buy Now

</a>

</div>

</div>

`;

});

},

error:function(err){

console.log("ERROR:");
console.log(err);

}

});

</script>

</body>
</html>
